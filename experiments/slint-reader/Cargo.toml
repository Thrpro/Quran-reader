[package]
name = "quran-slint-reader-prototype"
version = "0.20.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
build = "build.rs"

[features]
qa = []
# Windows only: play recitations through the native Windows media engine
# instead of the portable one in src/recitation.
native-audio = []

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-18", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
html-escape = "0.2"
harfrust = "=0.14.0"
skrifa = "0.44"
tiny-skia = "0.12"
png = "0.18"
# The portable recitation engine (src/recitation): MP3 decoding, sound output
# (WASAPI, CoreAudio, ALSA), HTTPS downloads and file hashes.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "id3v1", "id3v2"] }
cpal = "0.18"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.11"
# Plain 2-D matrix types used by the shared page-turn geometry; they build on
# every platform.
windows-numerics = "0.3"

# Windows: DirectWrite fallback text, Windows media playback and WinHTTP
# downloads, shared with the protected native app.
[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Media_Core", "Media_Playback", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_Graphics_Imaging", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_WinRT", "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading",
  "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_Storage_FileSystem",
  "Win32_UI_Shell", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"
] }

# Linux and macOS: the local time for the page clock, file locks and flags.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# The page renderer's libraries are compiled for speed, the rest for size.
# Size-optimised tiny-skia skips the inlining and vectorisation its pixel
# loops rely on: spreads drew about twice as slowly as at opt-level 2.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.harfrust]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.read-fonts]
opt-level = 3

# For trying changes while developing only: `cargo build --profile fast`.
# The same code, compiled across all processor threads without link-time
# optimisation, so a rebuild takes minutes instead of tens of minutes. Shipped
# builds (installer, ZIP, CI) always use the release profile above, and
# performance measurements belong on a release build.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.dev]
debug = 0
incremental = false

[workspace]

