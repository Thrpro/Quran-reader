[package]
name = "quran-mushaf-reader"
version = "0.5.8"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
build = "build.rs"

[features]
# Explicit opt-in for isolated native QA. Never enabled in shipping builds.
qa = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
webview2-com = "=0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

